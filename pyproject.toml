[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netrai-research"
version = "0.2.0.dev0"
description = "Research-only explainable diabetic-retinopathy screening pipeline"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4", "torchvision>=0.19", "timm>=1.0", "numpy>=2.0",
  "opencv-python-headless>=4.8", "pandas>=2.0", "scikit-learn>=1.3",
  "scipy>=1.11", "matplotlib>=3.7", "seaborn>=0.12", "Pillow>=10",
  "tqdm>=4.65", "grad-cam>=1.5", "joblib>=1.3"
]

[project.optional-dependencies]
onnx = ["onnx>=1.17", "onnxruntime>=1.20"]

[project.scripts]
netrai = "netrai.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["inference", "batch_validate", "train_grading", "prepare_training_manifest"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["netrai*", "models*", "modules*", "utils*", "weights*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
weights = ["*.json", "*.npy", "*.pth"]
